const SITES = DATA.sites;

let currentId = "compare";
let map, layerGroups = {};
let mapReady = false;

function fmtMoney(n){ if(n===null||n===undefined) return "—"; return "$"+Math.round(n).toLocaleString(); }
function fmtNum(n){ if(n===null||n===undefined) return "—"; return Math.round(n).toLocaleString(); }
function fmtPct(n){ if(n===null||n===undefined) return "—"; return n.toFixed(1)+"%"; }
function verdictClass(v){
  v = (v||"").toLowerCase();
  if(v==="pass" || v.indexOf("pass")===0) return "pass";
  if(v==="marginal" || v.indexOf("marginal")===0) return "marginal";
  if(v==="gap") return "gap";
  if(v==="fail") return "fail";
  if(v==="mismatch") return "mismatch";
  if(v==="unresolved") return "unresolved";
  return "other";
}

/* ---------------- Tabs ---------------- */
function buildTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = "";
  const cmp = document.createElement('div');
  cmp.className = 'tab' + (currentId==='compare' ? ' active':'');
  cmp.textContent = 'Compare all sites';
  cmp.onclick = () => selectSite('compare');
  tabs.appendChild(cmp);
  SITES.forEach(s=>{
    const t = document.createElement('div');
    t.className = 'tab' + (currentId===s.id ? ' active':'');
    t.textContent = s.short;
    t.onclick = () => selectSite(s.id);
    tabs.appendChild(t);
  });
}

function selectSite(id){
  currentId = id;
  buildTabs();
  if(id==='compare'){
    renderCompare();
    safeMap(renderCompareMap);
  } else {
    const s = SITES.find(x=>x.id===id);
    renderSite(s);
    safeMap(()=>renderSiteMap(s));
  }
  document.getElementById('content').scrollTop = 0;
}

function safeMap(fn){
  if(!mapReady){ return; }
  try { fn(); } catch(e){ console.error('Map render failed:', e); }
}

/* ---------------- Dossier render ---------------- */
function renderSite(s){
  const c = document.getElementById('content');

        <span class="submkt">${s.submarket}</span>

  if(s.reconstructedNote){ h += `<div class="recon-note">${s.reconstructedNote}</div>`; }
  h += `<div class="read"><strong>The read:</strong> ${s.read}</div>`;

  h += `<h3 class="section">Fit against the Slumberland prototype</h3>`;
  h += `<table class="fit"><tr><th>Metric</th><th>Benchmark</th><th>This site</th><th></th></tr>`;
  s.fitRows.forEach(r=>{
    h += `<tr><td>${r.metric}</td><td>${r.benchmark}</td><td>${r.site}</td><td><span class="badge ${verdictClass(r.verdict)}">${r.verdict}</span></td></tr>`;
  });
  h += `</table><p class="tanote">Benchmark source: ${BENCH.note}</p>`;

  h += `<h3 class="section">Property</h3><table class="kv">`;
  const p = s.property;
  const rows = [["Building", p.building_sf], ["Lot", p.lot], ["Zoning", p.zoning], ["Assessor land use", p.landUse],
                ["Parcel / APN", p.parcel], ["County", p.county], ["FEMA flood zone", p.flood],
                ["Year built", p.yearBuilt], ["Tenancy", p.tenancy], ["Asking", p.askingRent]];
  rows.forEach(([k,v])=>{ h += `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`; });
  h += `</table>`;

  h += `<h3 class="section">Trade area</h3>`;
  h += `<table class="zips"><tr><th>ZIP</th><th>Area</th><th>Pop.</th><th>HHI</th><th>Owner-occ</th><th>Med. home</th><th>Med. age</th></tr>`;
  s.tradeArea.zips.forEach(z=>{
    h += `<tr><td>${z.zip}</td><td>${z.area}</td><td>${fmtNum(z.pop)}</td><td>${fmtMoney(z.hhi)}</td><td>${z.owner}%</td><td>${fmtMoney(z.home)}</td><td>${z.age??'—'}</td></tr>`;
  });
  if(s.tradeArea.blended && s.tradeArea.blended.pop){
    const b = s.tradeArea.blended;
    h += `<tr class="blend"><td colspan="2">Blended</td><td>${fmtNum(b.pop)}</td><td>${fmtMoney(b.hhi)}</td><td>${fmtPct(b.owner)}</td><td>${fmtMoney(b.home)}</td><td>${b.age??'—'}</td></tr>`;
  }
  h += `</table>`;
  if(s.tradeArea.scenarios){
    s.tradeArea.scenarios.forEach(sc=>{
      h += `<table class="zips"><tr class="blend"><td colspan="2">${sc.label}</td><td>${fmtNum(sc.pop)}</td><td>${fmtMoney(sc.hhi)}</td><td>${fmtPct(sc.owner)}</td><td>${fmtMoney(sc.home)}</td><td>${sc.age}</td></tr></table>`;
    });
  }
  h += `<p class="tanote">${s.tradeArea.note}</p>`;

  h += `<h3 class="section">Competition</h3>`;
  s.competition.forEach(cm=>{
    h += `<div class="comp-row"><div><div class="nm">${cm.name}</div><div class="ad">${cm.addr}</div></div><div class="dist">${cm.distance}</div></div>`;
  });

  h += `<h3 class="section">Co-tenancy &amp; anchors</h3><p style="font-size:12.5px;line-height:1.55;">${s.coTenancy}</p>`;

  h += `<h3 class="section">What's changing nearby</h3><ul class="plain">`;
  s.whatsChanging.forEach(w=>{ h += `<li>${w}</li>`; });
  h += `</ul>`;

  h += `<h3 class="section">Access</h3><p style="font-size:12.5px;line-height:1.55;">${s.access}</p>`;

  h += `<h3 class="section">Flags</h3><ul class="plain flags">`;
  s.flags.forEach(f=>{ h += `<li>${f}</li>`; });
  h += `</ul>`;

  h += `<h3 class="section">Pull from CoStar</h3><ul class="plain gaps">`;
  s.costarGaps.forEach(g=>{ h += `<li>${g}</li>`; });
  h += `</ul>`;

  h += `<h3 class="section">Sources</h3><div class="sources">`;
  s.sources.forEach(src=>{ h += `<div><a href="${src.u}" target="_blank" rel="noopener">${src.t}</a></div>`; });
  h += `</div>`;

  h += `</div>`;
  c.innerHTML = h;
}

/* ---------------- Map ---------------- */
function initMap(){
  try{
    if(typeof L === 'undefined'){ throw new Error('Leaflet failed to load (no network / CDN blocked).'); }
    map = L.map('map', {zoomControl:true}).setView([36.05, -86.65], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
    mapReady = true;
  } catch(e){
    console.error('Map init failed:', e);
    mapReady = false;
    const ms = document.getElementById('mapside');
    if(ms){
      ms.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;color:#5b6472;font-size:14px;background:#eef1f5;">Map tiles could not load (this preview has no internet access). Open this file in a normal browser with an internet connection to see the interactive map — all dossier data on the left still works.</div>';
    }
  }
}

function clearMap(){
  Object.values(layerGroups).forEach(g=>map.removeLayer(g));
  layerGroups = {};
}

function mkIcon(color){
  return L.divIcon({
    className: '', html: `<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>`,
    iconSize:[16,16], iconAnchor:[8,16], popupAnchor:[0,-16]
  });
}
const SUBJECT_COLOR = '#c9852f';
const COMP_COLOR = '#b23b3b';
const OTHER_SUBJECT_COLOR = '#5b8bbf';

function renderCompareMap(){
  document.getElementById('maptitle').innerHTML = `<b>All six candidates</b>Metro Nashville regional view — click a pin or a table row to open that site's dossier.`;
  document.getElementById('layertoggles').innerHTML = '';
  document.getElementById('maplegend').innerHTML = `
    <div><span class="dot" style="background:${SUBJECT_COLOR}"></span> Candidate site</div>`;
  clearMap();
  const g = L.layerGroup().addTo(map);
  const bounds = [];
  SITES.forEach(s=>{
    const m = L.marker(s.coords, {icon: mkIcon(SUBJECT_COLOR)});
    m.bindPopup(`<b>${s.short}</b><br>${s.cityState}<br><a href="#" onclick="selectSite('${s.id}');return false;">Open dossier →</a>`);
    m.on('click', ()=>selectSite(s.id));
    g.addLayer(m);
    bounds.push(s.coords);
  });
  layerGroups.subjects = g;
  map.fitBounds(bounds, {padding:[40,40]});
}

function renderSiteMap(s){
  document.getElementById('maptitle').innerHTML = `<b>${s.short}</b>${s.cityState}`;
  clearMap();

  const subj = L.layerGroup();
  const subjMarker = L.marker(s.coords, {icon: mkIcon(SUBJECT_COLOR)});
  subjMarker.bindPopup(`<b>${s.address}</b><br>${s.cityState}<br>${s.property.building_sf}`);
  subj.addLayer(subjMarker);
  // radius rings for visual trade-area reference (straight-line, not drive-time)
  [1,3,5].forEach(mi=>{
    subj.addLayer(L.circle(s.coords, {radius: mi*1609.34, color: SUBJECT_COLOR, weight:1, fill:false, dashArray:'4,5', opacity:.5}));
  });

  const comp = L.layerGroup();
  const bounds = [s.coords];
  s.competition.forEach(cm=>{
    if(cm.coords){
      const m = L.marker(cm.coords, {icon: mkIcon(COMP_COLOR)});
      m.bindPopup(`<b>${cm.name}</b><br>${cm.addr}<br>${cm.distance}`);
      comp.addLayer(m);
      bounds.push(cm.coords);
    }
  });

  subj.addTo(map); comp.addTo(map);
  layerGroups.subject = subj;
  layerGroups.competitors = comp;

  document.getElementById('layertoggles').innerHTML = `
    <label><input type="checkbox" checked onchange="toggleLayer('subject', this.checked)"> Subject site + rings</label>
    <label><input type="checkbox" checked onchange="toggleLayer('competitors', this.checked)"> Furniture competitors</label>
  `;
  document.getElementById('maplegend').innerHTML = `
    <div><span class="dot" style="background:${SUBJECT_COLOR}"></span> Subject site (dashed = 1/3/5 mi, straight-line)</div>
    <div><span class="dot" style="background:${COMP_COLOR}"></span> Furniture competitor</div>`;

  if(bounds.length>1){ map.fitBounds(bounds, {padding:[60,60]}); }
  else { map.setView(s.coords, 13); }
}

function toggleLayer(key, on){
  if(!layerGroups[key]) return;
  if(on) layerGroups[key].addTo(map); else map.removeLayer(layerGroups[key]);
}

buildTabs();
initMap();
selectSite('compare');
