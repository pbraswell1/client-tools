<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Schedule · June 16, 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #F7F4EF;
  min-height: 100vh;
  color: #2D2D2D;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #FF6B35 0%, #FF9A3C 100%);
  color: white;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 16px rgba(255,107,53,0.3);
}
.header-left h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
.header-left p  { opacity: .88; font-size: .82rem; margin-top: 3px; }
.date-badge {
  background: rgba(255,255,255,.2);
  border-radius: 12px;
  padding: 10px 16px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.28);
}
.date-badge .dow   { font-size: .68rem; opacity: .82; text-transform: uppercase; letter-spacing: .7px; }
.date-badge .ddate { font-size: 1.2rem; font-weight: 800; line-height: 1.2; margin-top: 2px; }

/* ── Kid Selector ── */
.kid-selector {
  display: flex; background: white;
  border-bottom: 1px solid #E8E0D6;
  padding: 10px 14px; gap: 8px; overflow-x: auto;
}
.kid-card {
  flex: 1; min-width: 110px; max-width: 200px;
  border: 2px solid #E8E0D6; border-radius: 14px;
  padding: 11px 13px; cursor: pointer;
  transition: all .2s; background: #FAFAF8;
}
.kid-card:hover { border-color: #ccc; background: #F5F2EE; }
.kid-card.active { border-color: var(--kc); background: white; box-shadow: 0 2px 10px rgba(0,0,0,.09); }
.kid-top { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.kid-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--kc); color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: .9rem; flex-shrink: 0;
}
.kid-name  { font-weight: 800; font-size: .92rem; }
.kid-sport { font-size: .7rem; color: #999; margin-top: 1px; }
.kid-prog-row { display: flex; justify-content: space-between; font-size: .68rem; color: #aaa; margin-bottom: 3px; }
.kid-prog-bar  { height: 4px; background: #E8E0D6; border-radius: 99px; overflow: hidden; }
.kid-prog-fill { height: 100%; background: var(--kc); border-radius: 99px; transition: width .35s; }

/* ── Main ── */
.main { max-width: 560px; margin: 0 auto; padding: 16px 14px 52px; }

/* ── Progress card ── */
.prog-card {
  background: white; border-radius: 16px;
  padding: 14px 18px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.prog-ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
.prog-ring svg { transform: rotate(-90deg); }
.prog-pct {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .68rem; font-weight: 800;
}
.prog-details { flex: 1; min-width: 0; }
.prog-name { font-weight: 800; font-size: .94rem; }
.prog-sub  { font-size: .78rem; color: #999; margin-top: 2px; }
.prog-track { height: 6px; background: #E8E0D6; border-radius: 99px; margin-top: 7px; overflow: hidden; }
.prog-fill  { height: 100%; border-radius: 99px; transition: width .4s; }

/* ── Section card ── */
.section-card {
  background: white; border-radius: 16px;
  margin-bottom: 10px; overflow: hidden;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.section-head {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 16px;
  border-bottom: 1px solid #F2EBE2;
}
.section-label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .55px; color: #AAA; }

/* ── Task rows ── */
.task-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid #F2EBE2;
  cursor: pointer;
  user-select: none; -webkit-user-select: none;
  transition: background .12s;
}
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: #FDFAF7; }
.task-row:hover .chk { border-color: #4ECDC4; }
.chk {
  width: 20px; height: 20px; border-radius: 6px;
  border: 1.5px solid #D8D0C8; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s; margin-top: 1px; color: white; font-size: .75rem;
}
.task-row.done .chk { background: #4ECDC4; border-color: #4ECDC4; }
.task-lbl { font-size: .875rem; color: #333; line-height: 1.45; flex: 1; transition: all .18s; }
.task-row.done .task-lbl { text-decoration: line-through; color: #BEB6AE; }

/* Link tasks */
.task-link {
  display: inline-flex; align-items: center; gap: 5px;
  color: #4A7AFF;
  text-decoration: none;
  font-size: .875rem;
  line-height: 1.45;
  transition: color .15s;
}
.task-link:hover { color: #2255DD; text-decoration: underline; }
.task-row.done .task-link { color: #BEB6AE; text-decoration: line-through; pointer-events: none; }
.link-icon { font-size: .75rem; opacity: .7; flex-shrink: 0; }

/* ── Free time locked ── */
.free-locked {
  background: white; border-radius: 16px;
  padding: 18px 20px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
  opacity: .5;
}
.lock-icon  { font-size: 1.4rem; flex-shrink: 0; }
.lock-title { font-weight: 800; font-size: .94rem; }
.lock-sub   { font-size: .8rem; color: #999; margin-top: 2px; }

/* ── Free time unlocked ── */
.free-unlocked {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 16px; padding: 22px 20px; margin-bottom: 10px;
  text-align: center; color: white;
  box-shadow: 0 5px 20px rgba(102,126,234,.32);
}
.free-unlocked h3 { font-size: 1.4rem; font-weight: 900; }
.free-unlocked p  { opacity: .88; margin-top: 5px; font-size: .86rem; }
.idea-chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 13px; }
.chip {
  background: rgba(255,255,255,.22); padding: 5px 12px;
  border-radius: 20px; font-size: .77rem; font-weight: 500;
  border: 1px solid rgba(255,255,255,.2);
}

/* ── Reset ── */
.reset-wrap { text-align: center; margin-top: 8px; }
.reset-btn {
  background: none; border: 1px solid #E8E0D6;
  color: #BBB; padding: 7px 18px; border-radius: 20px;
  font-size: .76rem; cursor: pointer; transition: all .18s;
}
.reset-btn:hover { border-color: #FF6B35; color: #FF6B35; }

@media (max-width: 520px) {
  .header { flex-direction: column; text-align: center; gap: 10px; padding: 14px; }
  .header-left h1 { font-size: 1.2rem; }
  .kid-card { min-width: 95px; padding: 9px 10px; }
  .main { padding: 12px 10px 40px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>🌞 Family Daily Schedule</h1>
    <p>Record Real Estate Partners</p>
  </div>
  <div class="date-badge">
    <div class="dow">Tuesday</div>
    <div class="ddate">June 16<br>2026</div>
  </div>
</div>

<div class="kid-selector" id="kidSelector"></div>
<div class="main" id="mainContent"></div>

<script>
// ─────────────────────────────────────────────────
// Today's tasks — edit this each day
// ─────────────────────────────────────────────────
const DATE_KEY = '2026-06-16';

const FREE_IDEAS = [
  '🏊 Pool or lake','🎮 Video games','🎬 Movie','🚴 Bike ride',
  '🎨 Creative project','🏀 Sports','👫 Hang with friends','📚 Read',
  '🛹 Skateboard','🎵 Music','🌊 Beach','🎯 Mini golf',
  '🍦 Ice cream','🎲 Board games','🧘 Chill out'
];

const KIDS = [
  {
    name: 'Bo',
    color: '#FF6B35',
    sport: '⛳ Golf',
    sections: [
      {
        id: 'morning', icon: '🌅', label: 'Morning Routine',
        tasks: [
          { text: 'Make your bed' },
          { text: 'Clean your room' },
          { text: 'Make and eat breakfast (8:00 AM)' },
          { text: 'Go to golf work' }
        ]
      },
      {
        id: 'sport', icon: '⛳', label: 'Golf Focus',
        tasks: [
          { text: 'Stretch after work' },
          { text: 'Putt, chip, and hit a bucket of balls' },
          { text: 'Get shaft put into driver' },
          { text: 'Visualize you being successful at your sport' },
          { text: 'Enjoy the process 🏆' }
        ]
      },
      {
        id: 'work', icon: '🏠', label: 'Work — Record Real Estate Partners',
        tasks: [
          { text: 'Ask Claude to build you the next Agent (already built a lease comparison agent)' },
          { text: 'Work with Claude to figure out what the next best Agent will be' },
          { text: 'Build it out' },
          { text: 'Share it with Dad' }
        ]
      },
      {
        id: 'chore', icon: '🧹', label: 'Chores',
        tasks: [
          { text: 'Clean up piles of landscaping and take it to the street' },
          { text: 'Clean up kitchen after dinner' }
        ]
      }
    ]
  },
  {
    name: 'Ansley',
    color: '#9B59B6',
    sport: '💃 Dance',
    sections: [
      {
        id: 'morning', icon: '🌅', label: 'Morning Routine',
        tasks: [
          { text: 'Make your bed' },
          { text: 'Clean your room' },
          { text: 'Make & eat breakfast (8:30 AM)' },
          { text: 'Clean kitchen after breakfast' }
        ]
      },
      {
        id: 'sport', icon: '💃', label: 'Dance Focus',
        tasks: [
          { text: 'Work on movements — make them crisp' },
          { text: 'Work on the Vision tryout dances — crisp + clean' },
          { text: 'Work on turns & combinations' },
          { text: 'Run for at least a mile 🏃‍♀️' },
          { text: 'Do 40 push-ups 💪' }
        ]
      },
      {
        id: 'work', icon: '🏠', label: 'Work — Record Real Estate Partners',
        tasks: [
          { text: 'Post IG post' },
          { text: 'Work on an IG story (if that works on the computer)' },
          { text: 'Ask Claude to work through your news feed on Brentwood, Nashville, and Atlanta' },
          { text: 'Find the most interesting news and post about it as your one post for the day' },
          { text: 'Share what you\'ve learned with Charlotte on your news feed' }
        ]
      }
    ]
  },
  {
    name: 'Charlotte',
    color: '#4ECDC4',
    sport: '🏀 BBall + Running',
    sections: [
      {
        id: 'morning', icon: '🌅', label: 'Morning Routine',
        tasks: [
          { text: 'Make your bed' },
          { text: 'Clean your room' },
          { text: 'Make & eat breakfast (8:30 AM)' }
        ]
      },
      {
        id: 'sport', icon: '🏀', label: 'BBall & Running Focus',
        tasks: [
          { text: '25 shots from each of the blue tape spots outside' },
          { text: 'Run at least 1 mile 🏃‍♀️' },
          { text: 'Do 40 push-ups 💪' },
          { text: 'Do 40 sit-ups' },
          { text: 'Visualize making 3-pointers over and over again 🏀' }
        ]
      },
      {
        id: 'work', icon: '🏠', label: 'Work — Record Real Estate Partners',
        tasks: [
          { text: 'Post LinkedIn post' },
          { text: 'Work on LinkedIn posts for the rest of the week' },
          { text: 'Ask Claude to work through your news feed on Brentwood, Nashville, and Atlanta' },
          { text: 'Find the most interesting news and post about it as your one post for the day' },
          { text: 'Share what you\'ve learned with Ansley on your news feed' }
        ]
      }
    ]
  }
];

// ─────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────
let cKid = 0;

// ─────────────────────────────────────────────────
// Storage — keyed to this specific date
// ─────────────────────────────────────────────────
const tkey = (k, sec, i) => `daily_${DATE_KEY}_k${k}_${sec}_${i}`;
const isDone = (k, sec, i) => localStorage.getItem(tkey(k,sec,i)) === '1';
const setDone = (k, sec, i, v) => v
  ? localStorage.setItem(tkey(k,sec,i), '1')
  : localStorage.removeItem(tkey(k,sec,i));

function totals(k) {
  let t=0, dn=0;
  KIDS[k].sections.forEach(s => {
    s.tasks.forEach((_, i) => { t++; if (isDone(k, s.id, i)) dn++; });
  });
  return { total: t, done: dn };
}

// ─────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────
function render() {
  renderKids();
  renderMain();
}

function renderKids() {
  document.getElementById('kidSelector').innerHTML = KIDS.map((k, i) => {
    const { total, done } = totals(i);
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    return `
    <div class="kid-card${i===cKid?' active':''}" style="--kc:${k.color}" data-k="${i}">
      <div class="kid-top">
        <div class="kid-avatar">${k.name[0]}</div>
        <div>
          <div class="kid-name">${k.name}</div>
          <div class="kid-sport">${k.sport}</div>
        </div>
      </div>
      <div class="kid-prog-row"><span>Today</span><span>${done}/${total}</span></div>
      <div class="kid-prog-bar"><div class="kid-prog-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('kidSelector').querySelectorAll('.kid-card').forEach(c => {
    c.addEventListener('click', () => { cKid = +c.dataset.k; render(); });
  });
}

function renderMain() {
  const kid = KIDS[cKid];
  const { total, done } = totals(cKid);
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  const allDone = total > 0 && done === total;

  const r = 20, circ = 2 * Math.PI * r;
  const off = circ - (pct / 100) * circ;

  let h = '';

  // Progress card
  h += `
  <div class="prog-card">
    <div class="prog-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="#E8E0D6" stroke-width="4.5"/>
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="${kid.color}" stroke-width="4.5"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          stroke-linecap="round" style="transition:stroke-dashoffset .4s"/>
      </svg>
      <div class="prog-pct" style="color:${kid.color}">${pct}%</div>
    </div>
    <div class="prog-details">
      <div class="prog-name">${kid.name}'s day</div>
      <div class="prog-sub">${done} of ${total} tasks complete${allDone ? ' · All done! 🎉' : ''}</div>
      <div class="prog-track">
        <div class="prog-fill" style="background:${kid.color};width:${pct}%"></div>
      </div>
    </div>
  </div>`;

  // Sections
  kid.sections.forEach(sec => {
    const taskRows = sec.tasks.map((task, i) => {
      const dn = isDone(cKid, sec.id, i);
      const label = task.url
        ? `<a class="task-link" href="${task.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
             ${esc(task.text)} <span class="link-icon">↗</span>
           </a>`
        : `<span class="task-lbl">${esc(task.text)}</span>`;

      return `
      <div class="task-row${dn ? ' done' : ''}" data-sec="${sec.id}" data-i="${i}">
        <div class="chk">${dn ? '✓' : ''}</div>
        ${label}
      </div>`;
    }).join('');

    h += `
    <div class="section-card">
      <div class="section-head">
        <span style="font-size:1.1rem">${sec.icon}</span>
        <span class="section-label">${sec.label}</span>
      </div>
      ${taskRows}
    </div>`;
  });

  // Free time
  if (allDone) {
    const ideas = [...FREE_IDEAS].sort(() => Math.random() - .5).slice(0, 9);
    h += `
    <div class="free-unlocked">
      <h3>🎉 Free time!</h3>
      <p>Everything's done, ${kid.name} — go enjoy the rest of the day!</p>
      <div class="idea-chips">${ideas.map(x => `<span class="chip">${x}</span>`).join('')}</div>
    </div>`;
  } else {
    h += `
    <div class="free-locked">
      <div class="lock-icon">🔒</div>
      <div>
        <div class="lock-title">Free time</div>
        <div class="lock-sub">Unlocks when all tasks are done · ${total - done} left</div>
      </div>
    </div>`;
  }

  h += `
  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">Reset ${kid.name}'s checkboxes</button>
  </div>`;

  const el = document.getElementById('mainContent');
  el.innerHTML = h;

  // Task toggle
  el.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.tagName === 'A' || e.target.closest('a')) return;
      const sec = row.dataset.sec, i = +row.dataset.i;
      setDone(cKid, sec, i, !row.classList.contains('done'));
      render();
    });
  });

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm(`Reset all of ${KIDS[cKid].name}'s checkboxes?`)) return;
    KIDS[cKid].sections.forEach(s => {
      s.tasks.forEach((_, i) => setDone(cKid, s.id, i, false));
    });
    render();
  });
}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

render();
</script>
</body>
</html>
